<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World Chili Championship 2025{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #c23616 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            text-align: center;
            color: #c23616;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .chili-emoji {
            font-size: 3em;
            text-align: center;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        .nav-links {
            text-align: center;
            margin: 30px 0;
            padding: 20px 0;
        }
        
        .primary-vote-btn {
            display: inline-block;
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 20px 60px;
            font-size: 1.8em;
            border-radius: 15px;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.3);
            margin-bottom: 20px;
        }
        
        .primary-vote-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(39, 174, 96, 0.4);
            background: linear-gradient(135deg, #229954, #27ae60);
        }
        
        .secondary-links {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        
        .secondary-links a {
            margin: 0 15px;
            color: #999;
            text-decoration: none;
            font-size: 0.95em;
            padding: 6px 12px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .secondary-links a:hover {
            color: #666;
            background: #f5f5f5;
        }
        
        button, .btn {
            background: linear-gradient(135deg, #ee5a24, #c23616);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 90, 36, 0.4);
        }
        
        input[type="text"], input[type="number"], input[type="password"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            margin: 8px 0;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #ee5a24;
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <div class="container">
        <div class="chili-emoji">🌶️🔥🌶️</div>
        <h1>World Chili Championship 2025</h1>
        <p class="subtitle">{% block subtitle %}May the Best Chili Win!{% endblock %}</p>
        
        <div class="nav-links">
            <a href="{{ url_for('index') }}" class="primary-vote-btn">🗳️ VOTE NOW</a>
            <div class="secondary-links">
                <a href="{{ url_for('results') }}">🏆 Results</a>
                <a href="{{ url_for('admin') }}">⚙️ Fabian Admin</a>
            </div>
        </div>
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
